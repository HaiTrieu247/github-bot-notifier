name: Deploy Bot to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "=== Clone or pull latest code ==="
            if [ ! -d "${{ secrets.VPS_PROJECT_PATH }}/.git" ]; then
              echo "Repo not found — cloning for the first time"
              git clone https://github.com/${{ github.repository }}.git ${{ secrets.VPS_PROJECT_PATH }}
            fi
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git pull origin main

            echo "=== Checking .env ==="
            if [ ! -f .env ]; then
              echo ".env not found — copying from /home/github-bot-prod/.env"
              cp /home/github-bot-prod/.env .env
            else
              echo ".env already exists, skipping copy"
            fi

            echo "=== Checking POSTGRES_PASSWORD in .env ==="
            if ! grep -qE '^POSTGRES_PASSWORD=.+' .env; then
              echo "POSTGRES_PASSWORD not set — generating one"
              # Make sure we don't glue onto a last line without trailing newline
              [ -z "$(tail -c 1 .env)" ] || echo >> .env
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env
            fi

            echo "=== Rebuilding bot image ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache bot

            echo "=== Starting postgres ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait postgres

            echo "=== Migrating data from NeonDB (one-time, skipped once done) ==="
            bash scripts/migrate_from_neon.sh -f docker-compose.yml -f docker-compose.prod.yml

            echo "=== Restarting bot (zero-downtime swap) ==="
            # postgres is left out on purpose: no need to restart the DB on every deploy
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate --remove-orphans bot nginx

            echo "=== Waiting for health check ==="
            sleep 15
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

            echo "=== Cleaning up old images & build cache ==="
            docker image prune -f
            docker builder prune -f

            echo "=== Deploy complete! ==="
