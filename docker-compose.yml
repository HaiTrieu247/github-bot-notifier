services:

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Database (required — cloud NeonDB)
      DATABASE_URL: ${DATABASE_URL}

      # App
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Discord/GitHub config is stored in DB and managed via Admin Dashboard.
      # These env vars are used only as initial seed values on first run.
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_DEFAULT_CHANNEL_ID: ${DISCORD_DEFAULT_CHANNEL_ID:-}
      DISCORD_REPO_CHANNEL_MAP: ${DISCORD_REPO_CHANNEL_MAP:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_REPOSITORIES: ${GITHUB_REPOSITORIES:-}

    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge
