services:

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-github_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-github_bot}
    # Data lives in a named volume — survives rebuilds / force-recreate.
    # NEVER run `docker compose down -v`, it deletes this volume.
    volumes:
      - postgres_data:/var/lib/postgresql
    # No ports published: only reachable from bot_network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bot_network

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database (self-hosted postgres service above)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-github_bot}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-github_bot}

      # App
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Discord/GitHub config is stored in DB and managed via Admin Dashboard.
      # These env vars are used only as initial seed values on first run.
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_DEFAULT_CHANNEL_ID: ${DISCORD_DEFAULT_CHANNEL_ID:-}
      DISCORD_REPO_CHANNEL_MAP: ${DISCORD_REPO_CHANNEL_MAP:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_REPOSITORIES: ${GITHUB_REPOSITORIES:-}

      # Security
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}

    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge

volumes:
  postgres_data:
