# nginx/nginx.staging.conf
# Staging Nginx configuration for GitHub Discord Bot
# Domain: staging.example.com (replace with your actual domain)
#
# TLS: Uses Let's Encrypt via Certbot.
# To obtain a certificate for the first time, run:
#   certbot certonly --webroot -w /var/www/certbot -d staging.example.com
# Then restart nginx.
#
# Self-signed fallback: generate with:
#   openssl req -x509 -nodes -newkey rsa:4096 \
#     -keyout nginx/certs/privkey.pem \
#     -out nginx/certs/fullchain.pem \
#     -days 365 -subj '/CN=staging.example.com'

worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr rt=$request_time';

    access_log /var/log/nginx/access.log main;
    sendfile        on;
    keepalive_timeout 65;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options           DENY always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Rate limiting ────────────────────────────────────────────────────────
    # Limit GitHub webhook requests to 30 req/min per IP
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/m;
    # General API limit
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # ── Upstream ─────────────────────────────────────────────────────────────
    upstream fastapi_backend {
        server bot:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name staging.example.com;

        # Let's Encrypt HTTP-01 challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name staging.example.com;

        # ── TLS certificates ─────────────────────────────────────────────────
        # Option A: Let's Encrypt (preferred for staging with a real domain)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # ── TLS hardening ─────────────────────────────────────────────────────
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Request size limit ────────────────────────────────────────────────
        client_max_body_size 10m;

        # ── GitHub Webhook endpoint (public) ──────────────────────────────────
        # Only this path is meant to receive inbound traffic from GitHub.
        location /github/webhook {
            limit_req zone=webhook_limit burst=10 nodelay;

            proxy_pass         http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── Health check (public) ─────────────────────────────────────────────
        location /health {
            proxy_pass         http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   Connection      "";
            access_log off;
        }

        # ── Repository management API (internal or secured) ───────────────────
        # In staging, allow from localhost only. In production, protect with API key
        # or restrict to VPN/internal network using allow/deny directives.
        location /repositories {
            # Uncomment to restrict to localhost only in staging:
            # allow 127.0.0.1;
            # deny all;

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── Swagger/ReDoc docs (staging only) ─────────────────────────────────
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass         http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Connection        "";
        }

        # ── Block everything else ─────────────────────────────────────────────
        location / {
            return 404;
        }
    }
}
