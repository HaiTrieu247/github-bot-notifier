# nginx/nginx.staging.conf
# Internal Nginx configuration for GitHub Discord Bot
#
# This Nginx does NOT terminate TLS.
# TLS/HTTPS and path-level security are handled by the upstream reverse proxy.
#
# Traffic flow:
#   External Nginx / Cloudflare (HTTPS :443)
#       ↓
#   This Nginx (HTTP :8083)
#       ↓
#   bot:8000 (gunicorn)

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    # Note: HSTS is set by the upstream HTTPS reverse proxy, not here.

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=120r/m;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream fastapi_backend {
        server bot:8000;
        keepalive 32;
    }

    # ── Internal HTTP server ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        # ── GitHub Webhook — stricter rate limit ──────────────────────────────
        location /github/webhook {
            limit_req zone=webhook_limit burst=10 nodelay;

            proxy_pass         http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── Everything else → FastAPI (security handled upstream) ─────────────
        location / {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass         http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}